### High Availability Configuration

# This file configures settings for load balancing, failover, and overall system availability.

# Target Uptime SLA: 99.99%

system:
  availability:
    sla: "99.99%"
    deployment_strategy: "multi-region-active-active"

# Load Balancing Configuration
load_balancer:
  type: "aws_alb" # or "gcp_nlb", "nginx", etc.
  health_check:
    path: "/health"
    interval: "30s"
    timeout: "5s"
    unhealthy_threshold: "2"
    healthy_threshold: "3"

# Failover Configuration
failover:
  strategy: "automatic"
  detection_method: "health_checks"
  <bos>"